[project]
name = "prodagent"
description = "A tiny, legible agent runtime with zero third-party deps: a LangGraph-like kernel and ADK-like agents, small enough to read in a weekend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haoshuang Li" }]
keywords = [
  "agent",
  "agent-framework",
  "agent-runtime",
  "langgraph",
  "adk",
  "multi-agent",
  "event-sourcing",
  "build-your-own",
  "teaching",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Education",
]
dependencies = []
# Version lives in prodagent/__init__.py (single source of truth), read via
# [tool.setuptools.dynamic] — a release can never drift between repo and PyPI.
dynamic = ["version"]

[project.scripts]
prodagent = "src.cli:main"

[project.urls]
Homepage = "https://github.com/limenagent/prodagent"
Documentation = "https://limenagent.github.io/prodagent/"
Repository = "https://github.com/limenagent/prodagent"
Issues = "https://github.com/limenagent/prodagent/issues"
Changelog = "https://github.com/limenagent/prodagent/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4"]
ignore = [
  "E501",      # 中文注释/文案的行长交给内容本身，不机械折行
  "BLE001",    # 引擎/工具层把异常当数据反馈（失败也是产出）是本框架的立场
  "RUF001",    # 全角标点是本项目正字法，不是“易混淆字符”
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]    # __init__ 里 import 即再出口，不需要逐个引用
"src/playground/server.py" = ["RUF006"]  # 会话驱动有意 fire-and-forget，状态在 _SESSIONS

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
# setuptools>=77: PEP 639 SPDX license-expression support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# Ship the ADK-style builtin skills (markdown) so an installed code_detective
# sees the same skills as the source tree — no source/install drift.
"src.runtime" = ["builtin_skills/*/*.md"]
