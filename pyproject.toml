[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prodagent"
version = "1.0.0"
description = "Production-grade LLM agent framework — reliable, observable, and secure by default"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ProdAgent Contributors" }]
keywords = ["llm", "agent", "ai", "anthropic", "openai", "production", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40.0",
    "anyio>=4.4.0",
    "fastapi>=0.110",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.12.0",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
prodagent = "prodagent.playground.server:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
yaml = ["pyyaml>=6.0"]
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "prodagent[testing]",
    "prodagent[yaml]",
    "prodagent[otel]",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "vulture>=2.16",
]
all = [
    "prodagent[testing]",
    "prodagent[yaml]",
    "prodagent[otel]",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2",
]
neo4j = [
    "neo4j>=5.0",
]
qdrant = [
    "qdrant-client>=1.9",
]

[project.urls]
Homepage = "https://github.com/limenagent/prodagent"
Repository = "https://github.com/limenagent/prodagent"
Documentation = "https://github.com/limenagent/prodagent#readme"
"Bug Tracker" = "https://github.com/limenagent/prodagent/issues"

[tool.uv.workspace]
members = ["examples/*"]

[tool.uv.sources]
prodagent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prodagent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["prodagent"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["redis.*", "neo4j.*", "qdrant_client.*", "psycopg.*", "psycopg_pool.*", "yaml", "dating_chat.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/prodagent"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
