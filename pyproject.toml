[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prodagent"
version = "1.0.0"
description = "Production-grade LLM agent framework — reliable, observable, and secure by default"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ProdAgent Contributors" }]
keywords = ["llm", "agent", "ai", "anthropic", "openai", "production", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.12.0",
]

[project.scripts]
prodagent = "prodagent.playground.server:main"

[project.optional-dependencies]
openai = [
    "openai>=1.50.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
playground = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
yaml = ["pyyaml>=6.0"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
testing = [
    "hypothesis>=6.100",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "prodagent[testing]",
    "prodagent[yaml]",
    "prodagent[playground]",
    "prodagent[openai]",
    "prodagent[anthropic]",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "import-linter>=2.0",
]
all = [
    "prodagent[testing]",
    "prodagent[yaml]",
    "prodagent[openai]",
    "prodagent[anthropic]",
    "prodagent[playground]",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2",
]
neo4j = [
    "neo4j>=5.0",
]

[project.urls]
Homepage = "https://github.com/limenagent/prodagent"
Repository = "https://github.com/limenagent/prodagent"
Documentation = "https://github.com/limenagent/prodagent#readme"
"Bug Tracker" = "https://github.com/limenagent/prodagent/issues"

[tool.uv.workspace]
members = ["examples/*"]

[tool.uv.sources]
prodagent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prodagent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

# ── Determinism boundary (Replay law) ─────────────────────────────────────
# TID251 is intentionally NOT in `select`: the ban runs report-only
# (`ruff check --select TID251`, CI annotates without failing) for a soak
# period, then flips to error. In-domain code draws time/random/ids from
# prodagent.base.determinism accessors instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "draw from prodagent.base.determinism.now_wall — replay needs one clock seam"
"time.monotonic".msg = "draw from prodagent.base.determinism.now_monotonic — replay needs one clock seam"
"uuid.uuid4".msg = "draw from prodagent.base.determinism.new_uuid4 — replay re-mints recorded ids"
"random.uniform".msg = "draw from prodagent.base.determinism.random_uniform — replay needs one randomness seam"
"random.random".msg = "draw from prodagent.base.determinism (grow the port) — replay needs one randomness seam"
"datetime.datetime.now".msg = "draw from prodagent.base.time.now_utc — replay needs one clock seam"

# Domain attribution table: where the real sources stay legal. coordination
# folds into the boundary at U7; runtime is the assembly root; hooks carry
# observer timestamps (excluded projections); backends are live Effect
# implementations; playground is the UI surface; determinism itself is the
# sanctioned implementation; tests mint fixtures freely.
[tool.ruff.lint.per-file-ignores]
"src/prodagent/base/determinism.py" = ["TID251"]
"src/prodagent/coordination/**" = ["TID251"]
"src/prodagent/runtime/**" = ["TID251"]
"src/prodagent/hooks/**" = ["TID251"]
"src/prodagent/backends/**" = ["TID251"]
"src/prodagent/playground/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["prodagent"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["redis.*", "neo4j.*", "psycopg.*", "psycopg_pool.*", "yaml", "dating_chat.*", "fastapi.*", "starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prodagent.playground.server"
disable_error_code = ["misc", "untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/prodagent"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.importlinter]
root_packages = ["prodagent"]

[[tool.importlinter.contracts]]
name = "Playground is a leaf — nothing else in prodagent depends on it"
type = "forbidden"
source_modules = [
    "prodagent.base", "prodagent.kernel", "prodagent.runtime",
    "prodagent.coordination", "prodagent.cognition", "prodagent.plan",
    "prodagent.ports", "prodagent.backends", "prodagent.llm",
    "prodagent.tooling", "prodagent.mcp", "prodagent.hooks", "prodagent.skills",
]
forbidden_modules = ["prodagent.playground"]
