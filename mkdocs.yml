site_name: prodagent
site_description: 一份读得完的工业级 LLM Agent 实现——循环、预算、恢复、审批、协作、治理，每个机制小到一次读懂，完整到能上生产
site_url: https://limenagent.github.io/prodagent/
repo_url: https://github.com/limenagent/prodagent
repo_name: limenagent/prodagent
edit_uri: edit/main/docs/
copyright: AGPL-3.0

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: 切换到深色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: 切换到浅色 }

markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            merge_init_into_class: true

exclude_docs: |
  internal/
  decisions.md
  topics/compress_threshold.md
  column/

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 本书:
      - 序章 · 从 Python 基础到独立设计工业级 Agent 框架: book/ch00.md
      - 第 1 章 · 全景：从 10 行 demo 到一个工业级框架: book/ch01.md
      - 第 2 章 · 模型层：Agent 的大脑: book/ch02.md
      - 第 3 章 · 循环内核：Agent 的心跳: book/ch03.md
      - 第 4 章 · 预算：烧钱的闸门: book/ch04.md
      - 第 5 章 · 工具系统：Agent 的手: book/ch05.md
      - 第 6 章 · 记忆、压缩与技能: book/ch06.md
      - 第 7 章 · 事件日志与崩溃恢复: book/ch07.md
      - 第 8 章 · 审批：不可逆动作的门: book/ch08.md
      - 第 9 章 · 多 Agent 协作: book/ch09.md
      - 第 10 章 · 可观测：运行不再黑箱: book/ch10.md
      - 附录 · 知识点与工具书速查: book/appendix.md
      - 附录 · API 参考: book/api-reference.md
  - 社区:
      - 贡献指南: https://github.com/limenagent/prodagent/blob/main/CONTRIBUTING.md
      - 路线图: https://github.com/limenagent/prodagent/blob/main/ROADMAP.md
      - 常见问题: https://github.com/limenagent/prodagent/blob/main/FAQ.md
