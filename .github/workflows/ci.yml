name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dev environment
        run: uv sync --extra dev
      - name: Ruff (lint)
        run: |
          uv run ruff check src tests examples
          uv run ruff format --check src tests

  hashseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dev environment
        run: uv sync --extra dev
      # Order-independence under set/dict iteration randomness: the suite
      # must be green for any hash seed — a seed-flake here is a determinism
      # leak finding its way into control flow.
      - name: Pytest under alternate PYTHONHASHSEED
        run: |
          PYTHONHASHSEED=1 uv run pytest tests/ -q
          PYTHONHASHSEED=42 uv run pytest tests/ -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev environment
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      # The suite runs offline with scripted LLMs — zero API keys, zero
      # services. That is a feature; keep it true.
      - name: Pytest (offline)
        run: uv run pytest tests/ -q
