[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greeter-agent"
version = "0.1.0"
description = "Minimal ProdAgent example — one tool, one turn, the smallest end-to-end agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "agent", "minimal", "starter"]
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["greeter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
