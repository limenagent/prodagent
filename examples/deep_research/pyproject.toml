[project]
name = "deep-research-agent"
version = "0.1.0"
description = "ProdAgent example — PLAN_FIRST multi-hop research + replan + memory + injection defense."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_research"]

[tool.ruff]
target-version = "py311"
line-length = 100
