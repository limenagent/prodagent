[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader-agent"
version = "0.1.0"
description = "ProdAgent example — milk tea ordering: multi-turn chat + memory-driven replan + HITL order approval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "agent", "milk-tea", "ordering", "memory", "hitl", "approval"]
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
