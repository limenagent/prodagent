[project]
name = "dating-chat-agent"
version = "0.1.0"
description = "ProdAgent example — real Agent's memory + context compression vs. a hand-rolled truncating loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dating_chat"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
