[project]
name = "trip-planner-agent"
version = "0.1.0"
description = "ProdAgent example — Workflow DAG + spawn_agent fan-out + Memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_planner"]

[tool.ruff]
target-version = "py311"
line-length = 100
