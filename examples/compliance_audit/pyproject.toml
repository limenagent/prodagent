[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-audit-agent"
version = "0.1.0"
description = "ProdAgent example — PLAN_FIRST LLM-dynamic Plan + human approval gate + auto-replan on AML suspicious-transaction audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "agent", "compliance", "aml", "dynamic-plan", "replan", "plan-approval", "human-in-the-loop", "checkpoint"]
dependencies = ["prodagent"]

[tool.uv.sources]
prodagent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["compliance_audit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
