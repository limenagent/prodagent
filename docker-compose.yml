services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prodagent-postgres
    environment:
      POSTGRES_DB: prodagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prodagent
    ports:
      - "5433:5432"
    volumes:
      - prodagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prodagent"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prodagent-redis
    ports:
      - "6390:6379"
    volumes:
      - prodagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:latest
    container_name: prodagent-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - prodagent-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    container_name: prodagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - prodagent-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | head -1 | grep -q 200'"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  prodagent-postgres:
  prodagent-redis:
  prodagent-neo4j:
  prodagent-qdrant:
