<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prodagent playground</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>prodagent playground</h1>
  <div id="hud" class="hud">
    <span class="hud-item hud-agent">—</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-turn">Turn —</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-tokens">0 tok</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-cost">$0.00</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-tools">0 tools</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-subagents">0 sub</span>
    <span class="hud-sep">·</span>
    <span class="hud-item hud-pending">⏸ 0</span>
  </div>
  <span id="status" class="status">loading…</span>
  <button id="picker-toggle" class="picker-toggle" title="切换 agent 选择面板">≡ agents</button>
</header>
<section id="picker" class="picker">
  <div id="cards" class="cards"></div>
</section>
<main id="stream-section">
  <div id="stream"></div>
</main>
<footer class="composer">
  <div class="run-bar">
    <input id="task-input" type="text" placeholder="选一个 agent 后填充默认 task;Enter 发送" autocomplete="off">
    <button id="send-btn" disabled>💬 Send</button>
  </div>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
